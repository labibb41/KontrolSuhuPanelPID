%% ACL EMQX untuk project panel01.
%% Tempelkan di Authorization -> File -> Settings.
%% Pastikan rule terakhir default diganti menjadi {deny, all}.

{allow, {user, "esp_panel01"}, subscribe, [
  "panel01/setpoint",
  "panel01/mode",
  "panel01/relay/set",
  "panel01/relay2/set",
  "panel01/pid/#",
  "panel01/calibration/#"
]}.

{allow, {user, "esp_panel01"}, publish, [
  "panel01/suhu",
  "panel01/kelembapan",
  "panel01/status",
  "panel01/relay",
  "panel01/relay2",
  "panel01/pid/output"
]}.

{allow, {user, "web_panel01"}, subscribe, [
  "panel01/#"
]}.

{allow, {user, "web_panel01"}, publish, [
  "panel01/setpoint",
  "panel01/mode",
  "panel01/relay/set",
  "panel01/relay2/set",
  "panel01/pid/#",
  "panel01/calibration/#"
]}.

{deny, all}.
